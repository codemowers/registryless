apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
{{- if or (ne .Values.auth.mode "none") .Values.push.sync }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
rules:
  {{- if and (ne .Values.auth.mode "none") .Values.auth.legacyNamespaceCredentials }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [registryless-push, registryless-pull]
    verbs: [get]
  {{- end }}
  {{- if ne .Values.auth.mode "none" }}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  {{- end }}
  {{- if .Values.push.sync }}
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-auth
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ printf "%s-auth" .Release.Name | quote }}]
    verbs: [get, update]
  {{- if .Values.push.sync }}
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-auth
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
