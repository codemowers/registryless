{{- if not (has .Values.auth.mode (list "rbac" "none")) }}
{{- fail "auth.mode must be rbac or none" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: registryless
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registryless
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: registry-daemon
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: registryless
          image: {{ .Values.image | quote }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: REGISTRY_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AUTH_SECRET_NAME
              value: {{ printf "%s-auth" .Release.Name | quote }}
            - name: AGENT_SELECTOR
              value: {{ printf "app.kubernetes.io/name=registryless,app.kubernetes.io/instance=%s" .Release.Name | quote }}
            - name: PUSH_SYNC
              value: {{ .Values.push.sync | quote }}
            - name: PUSH_SYNC_TIMEOUT
              value: {{ .Values.push.syncTimeout | quote }}
            - name: LEGACY_NAMESPACE_AUTH
              value: {{ .Values.auth.legacyNamespaceCredentials | quote }}
            - name: OIDC_ENABLED
              value: {{ .Values.oidc.enabled | quote }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ printf "oidc-client-%s-owner-secrets" .Release.Name }}
                  key: OIDC_IDP_URI
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ printf "oidc-client-%s-owner-secrets" .Release.Name }}
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ printf "oidc-client-%s-owner-secrets" .Release.Name }}
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_USERNAME_CLAIM
              value: {{ .Values.oidc.usernameClaim | quote }}
            {{- if hasKey .Values.oidc "usernamePrefix" }}
            - name: OIDC_USERNAME_PREFIX
              value: {{ .Values.oidc.usernamePrefix | quote }}
            {{- end }}
            {{- if hasKey .Values.oidc "groupsPrefix" }}
            - name: OIDC_GROUPS_PREFIX
              value: {{ .Values.oidc.groupsPrefix | quote }}
            {{- end }}
            - name: DOCKER_PASSWORD_TTL
              value: {{ .Values.oidc.passwordTTL | quote }}
            {{- end }}
            - name: REGISTRY_HOST
              value: {{ required "registryHost is required" .Values.registryHost | quote }}
            - name: CONTAINERD_ADDRESS
              value: {{ printf "/run/containerd/%s" (base .Values.containerd.socket) | quote }}
            - name: CONTAINERD_NAMESPACE
              value: {{ .Values.containerd.namespace | quote }}
            - name: SNAPSHOTTER
              value: {{ .Values.containerd.snapshotter | quote }}
            - name: HTTP_PORT
              value: {{ .Values.httpPort | int64 | quote }}
            - name: METRICS_ADDRESS
              value: {{ printf ":%d" (int .Values.metricsPort) | quote }}
            - name: MULTICAST_INTERFACE
              value: {{ .Values.multicast.interface | quote }}
            - name: ADVERTISE_IP
              value: {{ .Values.multicast.advertiseIP | quote }}
            - name: MULTICAST_PORT
              value: {{ .Values.multicast.port | int64 | quote }}
            - name: MULTICAST_TTL
              value: {{ .Values.multicast.ttl | int64 | quote }}
            - name: MULTICAST_BYTES_PER_SECOND
              value: {{ .Values.multicast.bytesPerSecond | quote }}
            - name: MAX_BLOB_BYTES
              value: {{ .Values.maxBlobBytes | int64 | quote }}
            - name: UNPACK_IMAGES
              value: {{ .Values.unpackImages | quote }}
          ports:
            - name: registry
              containerPort: {{ .Values.httpPort }}
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
            - name: multicast
              containerPort: {{ .Values.multicast.port }}
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: containerd
              mountPath: /run/containerd
      volumes:
        - name: containerd
          hostPath:
            path: {{ dir .Values.containerd.socket | quote }}
            type: Directory
