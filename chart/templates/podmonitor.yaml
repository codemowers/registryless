{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor" }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: registryless
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: registryless
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
{{- end }}
