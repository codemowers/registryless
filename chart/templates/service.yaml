apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: registryless
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: registry
      port: 80
      targetPort: registry
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
